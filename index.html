function fmtDur(sec) {
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0) return `${h}h ${m}m`;
  if(m>0) return `${m}m ${s}s`;
  return `${s}s`;
}

function fmtDate(d) {
  const [y,mo,day] = d.split("-");
  return `${mo}/${day}`;
}

function exportCSV(data) {
  const rows=[["\uFEFFDate","Plan","Exercise","Set","Weight(kg)","Reps","Volume(kg)"]];
  Object.entries(data).sort().forEach(([date,rec])=>{
    (rec.sessions||[]).forEach(s=>{
      (s.sets||[]).forEach((set,i)=>{
        rows.push([date,rec.planName||"",s.exercise,i+1,set.weight||0,set.reps||0,(set.weight||0)*(set.reps||0)]);
      });
    });
  });
  const csv=rows.map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`train_${new Date().toISOString().slice(0,7)}.csv`; a.click();
}

function monthStats(data,mk) {
  let totalVol=0; const days=new Set(); const exMap={}; const planCount={};
  Object.entries(data).forEach(([date,rec])=>{
    if(!date.startsWith(mk)) return;
    const sessions=Array.isArray(rec)?rec:(rec.sessions||[]);
    if(sessions.length) days.add(date);
    if(rec.planName) planCount[rec.planName]=(planCount[rec.planName]||0)+1;
    sessions.forEach(s=>{
      (s.sets||[]).forEach(set=>{
        if(set.warmup) return; // warmup sets don't count
        const v=(set.weight||0)*(set.reps||0);
        totalVol+=v; exMap[s.exercise]=(exMap[s.exercise]||0)+v;
      });
    });
  });
  return {totalVol,days:days.size,exMap,planCount};
}

// Find last time this exercise was done (before today)
function getLastRecord(data, exerciseName, beforeDate) {
  const entries = Object.entries(data)
    .filter(([d]) => d < beforeDate)
    .sort((a,b) => b[0].localeCompare(a[0]));
  for(const [date, rec] of entries) {
    const sessions = Array.isArray(rec)?rec:(rec.sessions||[]);
    const found = sessions.find(s => s.exercise === exerciseName);
    if(found) return { date, sets: found.sets };
  }
  return null;
}

// ─── Active Workout Screen (one set at a time) ────────────────────────────────
function ActiveWorkout({ sessions, setSessions, planName, planColor, data, date, onFinish }) {
  // Flatten all sets into a list: [{exIdx, setIdx, exName, restSec}]
  const flat = [];
  sessions.forEach((s,ei)=>{
    s.sets.forEach((_,si)=>{ flat.push({ei,si,exName:s.exercise,restSec:s.restSec||90}); });
  });

  const [cursor,   setCursor]   = useState(0);
  const [elapsed,  setElapsed]  = useState(0);
  const [totalRest,setTotalRest]= useState(0);
  const [showSummary,setShowSummary]=useState(false);

  // Use wall-clock start time so background tab doesn't freeze elapsed
  const startTimeRef = useRef(Date.now());
  const elapsedRef   = useRef();

  // Rest timer: track wall-clock end time so background doesn't break it
  const [restRem,     setRestRem]     = useState(null);
  const [restEndTime, setRestEndTime] = useState(null); // absolute ms
  const [restRun,     setRestRun]     = useState(false);
  const restRef    = useRef();
  const restAccRef = useRef(0); // accumulated rest seconds

  // ── Audio system ──────────────────────────────────────────────
  // iOS requires an active audio session to play sound in background.
  // Strategy: play a silent looping audio to keep the session alive,
  // then play the beep on top of it.
  const silentRef = useRef(null);
  const beepRef   = useRef(null);
  const audioUnlocked = useRef(false);

  const buildWav = useCallback((tones, totalSec) => {
    const sr = 22050;
    const n  = Math.ceil(sr * totalSec);
    const buf = new Int16Array(n);
    tones.forEach(({freq, start, dur, vol=0.7})=>{
      const s = Math.floor(start*sr), e = Math.floor((start+dur)*sr);
      for(let i=s;i<e&&i<n;i++){
        const t=(i-s)/sr;
        const env = t<0.02?t/0.02:t>(dur-0.04)?(dur-t)/0.04:1;
        buf[i] = Math.round(Math.sin(2*Math.PI*freq*t)*env*vol*32767);
      }
    });
    const dl = buf.byteLength;
    const h  = new ArrayBuffer(44);
    const dv = new DataView(h);
    const ws = (o,s)=>[...s].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
    ws(0,"RIFF"); dv.setUint32(4,36+dl,true); ws(8,"WAVE");
    ws(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true);
    dv.setUint16(22,1,true); dv.setUint32(24,sr,true);
    dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
    ws(36,"data"); dv.setUint32(40,dl,true);
    const out = new Uint8Array(44+dl);
    out.set(new Uint8Array(h)); out.set(new Uint8Array(buf.buffer),44);
    let bin=""; out.forEach(b=>bin+=String.fromCharCode(b));
    return "data:audio/wav;base64,"+btoa(bin);
  },[]);

  const unlockAudio = useCallback(()=>{
    if(audioUnlocked.current) return;
    audioUnlocked.current = true;

    // 1. Silent loop (0.5s of silence, looping) — keeps iOS audio session alive
    const silentWav = buildWav([], 0.5);
    const silent = new Audio(silentWav);
    silent.loop = true;
    silent.volume = 0.001; // near-silent but not zero (iOS mutes true-0)
    silentRef.current = silent;
    silent.play().catch(()=>{});

    // 2. Beep sound (3 ascending tones)
    const beepWav = buildWav([
      {freq:660, start:0,    dur:0.18},
      {freq:880, start:0.22, dur:0.18},
      {freq:1100,start:0.44, dur:0.32},
    ], 0.9);
    const beep = new Audio(beepWav);
    beepRef.current = beep;
    beep.load();
  },[buildWav]);

  // Stop silent loop when component unmounts
  useEffect(()=>()=>{ silentRef.current?.pause(); },[]);

  // Alert: play beep + vibrate
  const alertDone = useCallback(()=>{
    try { navigator.vibrate && navigator.vibrate([200,100,200,100,400]); } catch{}
    if(beepRef.current){
      beepRef.current.currentTime = 0;
      beepRef.current.play().catch(()=>{});
    }
  },[]);

  // Elapsed ticker (wall-clock based)
  useEffect(()=>{
    elapsedRef.current=setInterval(()=>{
      setElapsed(Math.floor((Date.now()-startTimeRef.current)/1000));
    },1000);
    return()=>clearInterval(elapsedRef.current);
  },[]);

  // Rest ticker (wall-clock based)
  useEffect(()=>{
    if(restRun && restEndTime!==null){
      restRef.current=setInterval(()=>{
        const rem = Math.max(0, Math.ceil((restEndTime - Date.now())/1000));
        setRestRem(rem);
        if(rem<=0){
          clearInterval(restRef.current);
          setRestRun(false);
          const dur = Math.round((restEndTime - (restEndTime - (sessions[ei]?.restSec||90)*1000))/1000);
          restAccRef.current += (sessions[ei]?.restSec||90);
          setTotalRest(restAccRef.current);
          alertDone();
        }
      },500);
    }
    return()=>clearInterval(restRef.current);
  },[restRun, restEndTime, alertDone]);

  if(flat.length===0) return null;
  const cur = flat[cursor] || flat[flat.length-1];
  const { ei, si, exName, restSec } = cur;
  const curSet = sessions[ei].sets[si];
  const exTotalSets = sessions[ei].sets.length;
  const isLastSet = cursor === flat.length-1;

  // last record for this exercise
  const lastRec = getLastRecord(data, exName, date);

  // swap / add state
  const [showSwap, setShowSwap] = useState(false);
  const exercises = LS.get("wt_exercises", DEFAULT_EXERCISES);

  const swapExercise = (newName) => {
    // replace all sets of current exercise
    const ns = sessions.map((s,i)=>i===ei?{...s,exercise:newName,sets:s.sets.map(set=>({...set,done:false}))}:s);
    setSessions(ns); setShowSwap(false);
  };

  const addExerciseNow = (newName) => {
    const ns = [...sessions, {exercise:newName, restSec:90, sets:[{weight:0,reps:0,done:false},{weight:0,reps:0,done:false},{weight:0,reps:0,done:false}]}];
    setSessions(ns); setShowSwap(false);
  };

  const [swapMode, setSwapMode] = useState("swap"); // "swap" | "add"

  const updateCurSet = (f,v) => {
    const ns=sessions.map((s,i)=>i===ei?{...s,sets:s.sets.map((set,j)=>j===si?{...set,[f]:v}:set)}:s);
    setSessions(ns);
  };

  const adj = (f,delta) => {
    const cur2=sessions[ei].sets[si];
    const step=f==="weight"?2.5:1;
    const val=Math.max(0,(cur2[f]||0)+delta*step);
    updateCurSet(f, f==="weight"?Math.round(val*4)/4:val);
  };

  const doneSet = () => {
    unlockAudio();
    const ns=sessions.map((s,i)=>i===ei?{...s,sets:s.sets.map((set,j)=>j===si?{...set,done:true}:set)}:s);
    setSessions(ns);
    const mode = sessions[ei]?.mode||"normal";
    if(mode!=="dropset") {
      const dur = sessions[ei].restSec||90;
      setRestEndTime(Date.now() + dur*1000);
      setRestRem(dur);
      setRestRun(true);
    }
    if(!isLastSet) { setTimeout(()=>setCursor(c=>c+1),300); }
    else { clearInterval(elapsedRef.current); setTimeout(()=>setShowSummary(true),400); }
  };

  const skipRest=()=>{ unlockAudio(); clearInterval(restRef.current); setRestRun(false); setRestRem(null); setRestEndTime(null); };

  const pct = (cursor/(flat.length))*100;

  // ── Overview panel state ─────────────────────────────────────
  const [showOverview, setShowOverview] = useState(false);
  const [editMode,     setEditMode]     = useState(false);
  const [showAddEx,    setShowAddEx]    = useState(false);

  const moveEx = (idx, dir) => {
    const ns = [...sessions];
    const to = idx+dir;
    if(to<0||to>=ns.length) return;
    [ns[idx],ns[to]]=[ns[to],ns[idx]];
    setSessions(ns);
    // adjust cursor: find new flat position of current set
    const newFlat=[];
    ns.forEach((s,ei2)=>s.sets.forEach((_,si2)=>newFlat.push({ei:ei2,si:si2})));
    const match = newFlat.findIndex(f=>f.ei===ei&&f.si===si);
    if(match>=0) setCursor(match);
  };

  const deleteEx = (idx) => {
    if(sessions.length<=1) return;
    const ns = sessions.filter((_,i)=>i!==idx);
    setSessions(ns);
    // recalculate cursor
    const newFlat=[];
    ns.forEach((s,ei2)=>s.sets.forEach((_,si2)=>newFlat.push({ei:ei2,si:si2})));
    setCursor(Math.min(cursor, Math.max(0,newFlat.length-1)));
  };

  const jumpToEx = (idx) => {
    // jump cursor to first set of that exercise
    let pos=0;
    for(let i=0;i<idx;i++) pos+=sessions[i].sets.length;
    setCursor(pos);
    setShowOverview(false); setEditMode(false);
  };

  const addExFromOverview = (name) => {
    const ns=[...sessions,{exercise:name,restSec:90,sets:[{weight:0,reps:0,done:false},{weight:0,reps:0,done:false},{weight:0,reps:0,done:false}]}];
    setSessions(ns); setShowAddEx(false);
  };

  const totalVol = sessions.reduce((a,s)=>a+s.sets.reduce((b,set)=>b+(set.weight||0)*(set.reps||0),0),0);
  const totalSetsCount = sessions.reduce((a,s)=>a+s.sets.length,0);
  const doneSetsCount  = sessions.reduce((a,s)=>a+s.sets.filter(set=>set.done).length,0);

  const [showBarbell, setShowBarbell] = useState(false);

  return (
    <div style={{position:"fixed",inset:0,background:"#060c18",display:"flex",flexDirection:"column",zIndex:100,maxWidth:480,margin:"0 auto"}}>
      {showSummary&&<SummaryModal totalSec={elapsed} restSec={totalRest} sessions={sessions} planName={planName} onClose={onFinish}/>}
      {showBarbell&&<BarbellCalc initWeight={curSet.weight||0} onClose={()=>setShowBarbell(false)}/>}

      {/* Swap / Add modal (from 換 button) */}
      {showSwap&&(
        <div style={{position:"absolute",inset:0,zIndex:200}}>
          <div style={{position:"absolute",inset:0,background:"#000000dd",display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
            <div style={{background:"#0d1422",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:480,border:"1px solid #1e2a40",borderBottom:"none",maxHeight:"80vh",display:"flex",flexDirection:"column"}}>
              <div style={{padding:"16px 18px 10px",borderBottom:"1px solid #1a2535"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                  <div style={{color:"#d0d8e8",fontWeight:800,fontSize:15,flex:1}}>{swapMode==="swap"?"換掉這個動作":"新增動作"}</div>
                  <button onClick={()=>setShowSwap(false)} style={{background:"transparent",border:"1px solid #2a3a50",borderRadius:8,color:"#556",fontSize:13,padding:"4px 12px",cursor:"pointer"}}>關閉</button>
                </div>
                <div style={{display:"flex",background:"#0a0e18",borderRadius:9,padding:3,gap:2,marginBottom:10}}>
                  {[{id:"swap",label:`換掉「${exName}」`},{id:"add",label:"新增動作"}].map(m=>(
                    <button key={m.id} onClick={()=>setSwapMode(m.id)}
                      style={{flex:1,background:swapMode===m.id?"#0e1a2e":"transparent",border:swapMode===m.id?"1px solid #00e5ff22":"1px solid transparent",
                        borderRadius:7,color:swapMode===m.id?"#00e5ff":"#445",fontSize:11,fontWeight:swapMode===m.id?700:400,padding:"7px 0",cursor:"pointer"}}>
                      {m.label}
                    </button>
                  ))}
                </div>
                {swapMode==="swap"&&<div style={{color:"#f0a500",fontSize:11,padding:"6px 10px",background:"#f0a50010",borderRadius:7,border:"1px solid #f0a50033"}}>⚠ 替換動作，已做重量保留</div>}
              </div>
              <ExPickerBody exercises={exercises} onSelect={swapMode==="swap"?swapExercise:addExerciseNow}/>
            </div>
          </div>
        </div>
      )}

      {/* ── Overview Panel ──────────────────────────────────── */}
      {showOverview&&(
        <div style={{position:"absolute",inset:0,zIndex:150,display:"flex",flexDirection:"column"}}>
          {/* Dim backdrop - tap to close */}
          <div style={{flex:1,background:"#00000055"}} onClick={()=>{setShowOverview(false);setEditMode(false);}}/>
          {/* Sheet */}
          <div style={{background:"#0d1422",borderRadius:"20px 20px 0 0",border:"1px solid #1e2a40",borderBottom:"none",maxHeight:"85vh",display:"flex",flexDirection:"column"}}>
            {/* Sheet header */}
            <div style={{padding:"14px 18px 12px",borderBottom:"1px solid #1a2535"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <div style={{color:"#d0d8e8",fontWeight:900,fontSize:16,flex:1}}>{planName}</div>
                <button onClick={()=>setEditMode(e=>!e)}
                  style={{background:editMode?"#00e5ff18":"#0e1420",border:`1px solid ${editMode?"#00e5ff44":"#2a3a50"}`,
                    borderRadius:8,color:editMode?"#00e5ff":"#778",fontSize:13,padding:"5px 14px",cursor:"pointer",fontWeight:editMode?700:400}}>
                  {editMode?"完成":"編輯"}
                </button>
                <button onClick={()=>{setShowOverview(false);setEditMode(false);}}
                  style={{background:"transparent",border:"1px solid #2a3a50",borderRadius:8,color:"#556",fontSize:13,padding:"5px 12px",cursor:"pointer"}}>✕</button>
              </div>
              {/* Stats row */}
              <div style={{display:"flex",gap:0,background:"#080e18",borderRadius:10,padding:"10px 0"}}>
                {[
                  {label:"EXERCISES",val:sessions.length},
                  {label:"SETS",val:`${doneSetsCount}/${totalSetsCount}`},
                  {label:"TIME",val:fmtDur(elapsed)},
                  {label:"VOLUME",val:totalVol>0?`${(totalVol/1000).toFixed(1)}t`:"—"},
                ].map((k,i)=>(
                  <div key={k.label} style={{flex:1,textAlign:"center",borderRight:i<3?"1px solid #1a2535":"none"}}>
                    <div style={{color:"#00e5ff",fontWeight:800,fontSize:15}}>{k.val}</div>
                    <div style={{color:"#334",fontSize:9,marginTop:1,letterSpacing:1}}>{k.label}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Exercise list */}
            <div style={{flex:1,overflowY:"auto",padding:"8px 14px"}}>
              {sessions.map((s,idx)=>{
                const isCurrent = idx===ei;
                const exDone = s.sets.every(set=>set.done);
                const exVol  = s.sets.reduce((a,set)=>a+(set.weight||0)*(set.reps||0),0);
                return (
                  <div key={idx} style={{display:"flex",alignItems:"center",gap:8,padding:"11px 12px",marginBottom:5,
                    background:isCurrent?`${planColor}12`:"#0e1420",borderRadius:12,
                    border:`1px solid ${isCurrent?planColor+"44":exDone?"#22c55e33":"#1a2535"}`,cursor:editMode?"default":"pointer"}}
                    onClick={()=>!editMode&&jumpToEx(idx)}>

                    {editMode ? (
                      // Edit mode: up/down/delete
                      <div style={{display:"flex",flexDirection:"column",gap:3,flexShrink:0}}>
                        <button onClick={()=>moveEx(idx,-1)} disabled={idx===0}
                          style={{width:24,height:20,background:"#0a0e18",border:"1px solid #2a3a50",borderRadius:4,
                            color:idx===0?"#2a3a50":"#aab",cursor:idx===0?"not-allowed":"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>▲</button>
                        <button onClick={()=>moveEx(idx,1)} disabled={idx===sessions.length-1}
                          style={{width:24,height:20,background:"#0a0e18",border:"1px solid #2a3a50",borderRadius:4,
                            color:idx===sessions.length-1?"#2a3a50":"#aab",cursor:idx===sessions.length-1?"not-allowed":"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>▼</button>
                      </div>
                    ) : (
                      // Normal: status icon
                      <div style={{width:28,height:28,borderRadius:8,flexShrink:0,
                        background:exDone?"#22c55e18":isCurrent?`${planColor}18`:"#0a0e18",
                        border:`1px solid ${exDone?"#22c55e44":isCurrent?planColor+"44":"#1a2535"}`,
                        display:"flex",alignItems:"center",justifyContent:"center",
                        color:exDone?"#22c55e":isCurrent?planColor:"#445",fontSize:12,fontWeight:800}}>
                        {exDone?"✓":idx+1}
                      </div>
                    )}

                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{color:isCurrent?planColor:exDone?"#22c55e":"#d0d8e8",fontWeight:700,fontSize:14,
                          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.exercise}</span>
                        {isCurrent&&<span style={{color:planColor,fontSize:10,background:`${planColor}18`,borderRadius:10,padding:"1px 6px",flexShrink:0}}>進行中</span>}
                      </div>
                      <div style={{color:"#445",fontSize:11,marginTop:2}}>
                        {s.sets.filter(set=>set.done).length}/{s.sets.length} 組完成
                        {exVol>0&&<span style={{color:"#f0a500",marginLeft:6}}>{exVol.toLocaleString()}kg</span>}
                      </div>
                    </div>

                    {/* Sets count with < > in edit mode, or just count */}
                    <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
                      {editMode&&(
                        <button onClick={e=>{e.stopPropagation();if(s.sets.length>1){const ns=sessions.map((ses,i)=>i===idx?{...ses,sets:ses.sets.slice(0,-1)}:ses);setSessions(ns);}}}
                          style={{width:22,height:22,borderRadius:4,background:"#0a0e18",border:"1px solid #2a3a50",color:"#aab",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>‹</button>
                      )}
                      <div style={{textAlign:"center",minWidth:20}}>
                        <div style={{color:"#aab",fontWeight:700,fontSize:15}}>{s.sets.length}</div>
                        <div style={{color:"#334",fontSize:9}}>SETS</div>
                      </div>
                      {editMode&&(
                        <button onClick={e=>{e.stopPropagation();const last=s.sets.slice(-1)[0]||{weight:0,reps:0};const ns=sessions.map((ses,i)=>i===idx?{...ses,sets:[...ses.sets,{weight:last.weight,reps:last.reps,done:false}]}:ses);setSessions(ns);}}
                          style={{width:22,height:22,borderRadius:4,background:"#0a0e18",border:"1px solid #2a3a50",color:"#aab",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>›</button>
                      )}
                      {editMode&&(
                        <button onClick={e=>{e.stopPropagation();deleteEx(idx);}}
                          style={{width:28,height:28,borderRadius:7,background:"#ff4d6d0a",border:"1px solid #ff4d6d33",
                            color:"#ff4d6d",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,marginLeft:4}}>×</button>
                      )}
                    </div>
                  </div>
                );
              })}

              {/* Add exercise button */}
              {showAddEx ? (
                <ExPickerBody exercises={exercises} onSelect={addExFromOverview}/>
              ) : (
                <button onClick={()=>setShowAddEx(true)}
                  style={{width:"100%",background:"#00e5ff08",border:"1px dashed #00e5ff2a",borderRadius:12,
                    color:"#00e5ff55",fontSize:13,padding:"12px",cursor:"pointer",marginTop:4,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                  ＋ ADD EXERCISE
                </button>
              )}
            </div>

            {/* Finish button */}
            <div style={{padding:"12px 16px 24px",borderTop:"1px solid #1a2535"}}>
              <button onClick={()=>{clearInterval(elapsedRef.current);clearInterval(restRef.current);setShowOverview(false);setShowSummary(true);}}
                style={{width:"100%",background:"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",borderRadius:12,
                  color:"#000",fontWeight:900,fontSize:15,padding:"13px",cursor:"pointer",letterSpacing:1}}>
                Finish Workout ✓
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Top bar */}
      <div style={{padding:"12px 16px 10px",background:"#0a1020"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <button onClick={()=>{ clearInterval(elapsedRef.current); clearInterval(restRef.current); onFinish(); }}
            style={{background:"transparent",border:"1px solid #1e2a40",borderRadius:8,color:"#556",fontSize:12,padding:"5px 12px",cursor:"pointer"}}>
            ← 離開
          </button>
          {/* Tap to show overview */}
          <button onClick={()=>{setShowOverview(true);setEditMode(false);setShowAddEx(false);}}
            style={{flex:1,background:"transparent",border:"none",cursor:"pointer",textAlign:"center",padding:0}}>
            <div style={{color:planColor,fontWeight:800,fontSize:13}}>{planName}</div>
            <div style={{color:"#334",fontSize:10,marginTop:1}}>▼ 查看課表總覽</div>
          </button>
          <div style={{color:"#00e5ff",fontFamily:"monospace",fontSize:14,fontWeight:700}}>{fmtDur(elapsed)}</div>
        </div>
        {/* Progress bar */}
        <div style={{background:"#1a2535",borderRadius:99,height:4}}>
          <div style={{background:`linear-gradient(90deg,${planColor},#0077cc)`,borderRadius:99,height:"100%",width:`${pct}%`,transition:"width 0.4s"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
          <span style={{color:"#445",fontSize:10}}>{exName}</span>
          <span style={{color:"#445",fontSize:10}}>{cursor+1}/{flat.length} 組</span>
        </div>
      </div>

      {/* Exercise name + set counter */}
      <div style={{padding:"16px 24px 0",textAlign:"center"}}>
        {(()=>{
          const mode=sessions[ei]?.mode||"normal";
          const MBADGE={warmup:{c:"#f0a500",l:"🔥 暖身"},superset:{c:"#a855f7",l:"⚡ 超級組"},
            dropset:{c:"#ff6b6b",l:"↘ 遞減"},pyramid:{c:"#4ecdc4",l:"△ 金字塔"},unilateral:{c:"#6bcb77",l:"↔ 單邊"}};
          const mb=MBADGE[mode];
          return mb?<div style={{display:"inline-block",background:`${mb.c}18`,border:`1px solid ${mb.c}44`,borderRadius:20,color:mb.c,fontSize:10,padding:"2px 10px",marginBottom:6,fontWeight:700}}>{mb.l}</div>:null;
        })()}
        {sessions[ei]?.sets[si]?.warmup&&<div style={{color:"#f0a500",fontSize:11,marginBottom:4}}>⚠ 暖身組（不計入統計）</div>}
        <div style={{color:planColor,fontWeight:900,fontSize:13,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>
          SET {si+1} / {exTotalSets}
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:2}}>
          <div style={{color:"#e0e8f0",fontWeight:900,fontSize:22}}>{exName}</div>
          <button onClick={()=>setShowSwap(true)}
            style={{background:"#f0a50015",border:"1px solid #f0a50044",borderRadius:7,color:"#f0a500",fontSize:11,padding:"3px 9px",cursor:"pointer",flexShrink:0}}>換</button>
        </div>
        {sessions[ei]?.superPair&&<div style={{color:"#a855f7",fontSize:11,marginTop:2}}>⚡ 接著做：<span style={{fontWeight:700}}>{sessions[ei].superPair}</span></div>}
        <div style={{display:"flex",justifyContent:"center",gap:5,marginTop:8}}>
          {sessions[ei].sets.map((s,j)=>(
            <div key={j} style={{width:j===si?20:8,height:8,borderRadius:99,transition:"width 0.2s",
              background:j<si?"#22c55e":j===si?planColor:s.warmup?"#f0a50044":"#1a2535"}}/>
          ))}
        </div>
      </div>

      {/* Main controls */}
      <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"0 24px",gap:12}}>
        {sessions[ei]?.mode==="unilateral" ? (
          <div style={{display:"flex",gap:16}}>
            {[{side:"左",field:"weight",color:"#00e5ff"},{side:"右",field:"weightR",color:"#6bcb77"}].map(({side,field,color})=>(
              <div key={side} style={{flex:1}}>
                <div style={{color:"#445",fontSize:11,textAlign:"center",marginBottom:8}}>{side} KGS</div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  <button onClick={()=>{const v=Math.max(0,Math.round(((curSet[field]||0)-2.5)*4)/4);updateCurSet(field,v);}}
                    style={{width:44,height:44,borderRadius:"50%",background:"#0e1a2e",border:`2px solid ${color}44`,color,fontSize:24,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:300}}>−</button>
                  <div style={{color:"#fff",fontSize:36,fontWeight:900,minWidth:56,textAlign:"center"}}>{curSet[field]||0}</div>
                  <button onClick={()=>{const v=Math.round(((curSet[field]||0)+2.5)*4)/4;updateCurSet(field,v);}}
                    style={{width:44,height:44,borderRadius:"50%",background:"#0e1a2e",border:`2px solid ${color}44`,color,fontSize:24,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:300}}>+</button>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div>
            <div style={{color:"#445",fontSize:11,textAlign:"center",marginBottom:10,letterSpacing:2}}>KGS</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:24}}>
              <button onClick={()=>adj("weight",-1)}
                style={{width:64,height:64,borderRadius:"50%",background:"#0e1a2e",border:`2px solid ${planColor}44`,color:planColor,fontSize:28,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:300}}>−</button>
              <div style={{width:120,textAlign:"center"}}>
                <div style={{color:"#fff",fontSize:56,fontWeight:900,lineHeight:1,fontVariantNumeric:"tabular-nums"}}>{curSet.weight||0}</div>
              </div>
              <button onClick={()=>adj("weight",1)}
                style={{width:64,height:64,borderRadius:"50%",background:"#0e1a2e",border:`2px solid ${planColor}44`,color:planColor,fontSize:28,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:300}}>+</button>
            </div>
            <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:8,flexWrap:"wrap"}}>
              {[5,10,20].map(v=>(
                <button key={v} onClick={()=>updateCurSet("weight",v)}
                  style={{background:"#0e1a2e",border:"1px solid #1e2a40",borderRadius:20,color:"#556",fontSize:11,padding:"3px 10px",cursor:"pointer"}}>={v}</button>
              ))}
              <button onClick={()=>setShowBarbell(true)}
                style={{background:"#00e5ff0a",border:"1px solid #00e5ff33",borderRadius:20,color:"#00e5ff",fontSize:11,padding:"3px 12px",cursor:"pointer"}}>🔩 槓片</button>
            </div>
            {sessions[ei]?.mode==="dropset"&&si>0&&(
              <div style={{textAlign:"center",marginTop:6,color:"#ff6b6b",fontSize:11}}>
                建議：{Math.round((sessions[ei].sets[si-1]?.weight||0)*0.9/2.5)*2.5}kg（上組 -10%）
              </div>
            )}
            {sessions[ei]?.mode==="pyramid"&&(
              <div style={{textAlign:"center",marginTop:6,color:"#4ecdc4",fontSize:11}}>
                {si<Math.ceil(exTotalSets/2)-1?"↑ 遞增階段":si===Math.ceil(exTotalSets/2)-1?"🔝 頂點":"↓ 遞減階段"}
              </div>
            )}
          </div>
        )}

        {/* Reps */}
        <div>
          <div style={{color:"#445",fontSize:11,textAlign:"center",marginBottom:10,letterSpacing:2}}>REPS</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:24}}>
            <button onClick={()=>adj("reps",-1)}
              style={{width:64,height:64,borderRadius:"50%",background:"#0e1a2e",border:`2px solid ${planColor}44`,color:planColor,fontSize:28,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:300}}>−</button>
            <div style={{width:120,textAlign:"center"}}>
              <div style={{color:"#fff",fontSize:56,fontWeight:900,lineHeight:1,fontVariantNumeric:"tabular-nums"}}>{curSet.reps||0}</div>
            </div>
            <button onClick={()=>adj("reps",1)}
              style={{width:64,height:64,borderRadius:"50%",background:"#0e1a2e",border:`2px solid ${planColor}44`,color:planColor,fontSize:28,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:300}}>+</button>
          </div>
        </div>
      </div>

      {/* Rest timer overlay – no ring, just big number */}
      {restRem!==null && (
        <div style={{position:"absolute",inset:0,background:"#060c18f0",display:"flex",flexDirection:"column",
          alignItems:"center",justifyContent:"center",zIndex:10,gap:0}}>
          <div style={{color:"#445",fontSize:12,letterSpacing:3,marginBottom:8}}>組間休息</div>
          <div style={{
            color: restRem===0?"#ff4d6d": restRem<=10?"#f0a500":planColor,
            fontSize:96,fontWeight:900,fontFamily:"monospace",lineHeight:1,
            transition:"color 0.3s",
            textShadow: restRem===0?`0 0 40px #ff4d6d88`: restRem<=10?`0 0 30px #f0a50066`:`0 0 30px ${planColor}44`
          }}>
            {restRem}
          </div>
          <div style={{color:"#445",fontSize:13,marginTop:12,marginBottom:24}}>
            {restRem===0?"⏰ 準備好了！": `秒後繼續`}
          </div>
          <button onClick={skipRest}
            style={{background: restRem===0?`${planColor}22`:"#ff4d6d18",
              border:`1px solid ${restRem===0?planColor+"55":"#ff4d6d55"}`,
              borderRadius:12,color:restRem===0?planColor:"#ff4d6d",
              fontSize:15,fontWeight:700,padding:"12px 36px",cursor:"pointer"}}>
            {restRem===0?"繼續下一組 →":"跳過休息"}
          </button>
        </div>
      )}

      {/* Bottom: last record + done button */}
      <div style={{padding:"0 20px 32px",background:"#0a1020"}}>
        {/* Last record */}
        {lastRec ? (
          <div style={{background:"#0e1a2e",borderRadius:10,padding:"10px 14px",marginBottom:12,border:"1px solid #1a2535"}}>
            <div style={{color:"#334",fontSize:10,marginBottom:6,letterSpacing:1}}>上次紀錄 {fmtDate(lastRec.date)}</div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              {lastRec.sets.map((s,i)=>(
                <div key={i} style={{color:"#556",fontSize:12}}>
                  <span style={{color:"#667"}}>S{i+1} </span>
                  <span style={{color:s.weight===curSet.weight&&s.reps===curSet.reps?"#22c55e":"#778",fontWeight:600}}>
                    {s.weight}×{s.reps}
                  </span>
                </div>
              ))}
            </div>
            {/* Comparison hint */}
            {si < lastRec.sets.length && (() => {
              const ls = lastRec.sets[si];
              const diff = (curSet.weight*curSet.reps) - (ls.weight*ls.reps);
              if(diff>0) return <div style={{color:"#22c55e",fontSize:11,marginTop:4}}>↑ 比上次多 {diff} kg 訓練量</div>;
              if(diff<0) return <div style={{color:"#f0a500",fontSize:11,marginTop:4}}>↓ 比上次少 {Math.abs(diff)} kg 訓練量</div>;
              return <div style={{color:"#445",fontSize:11,marginTop:4}}>= 與上次相同</div>;
            })()}
          </div>
        ) : (
          <div style={{background:"#0e1a2e",borderRadius:10,padding:"10px 14px",marginBottom:12,border:"1px solid #1a2535"}}>
            <div style={{color:"#334",fontSize:11,textAlign:"center"}}>此動作尚無歷史紀錄</div>
          </div>
        )}

        {/* Nav + Done */}
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <button onClick={()=>setCursor(c=>Math.max(0,c-1))} disabled={cursor===0}
            style={{width:48,height:48,borderRadius:12,background:"#0e1a2e",border:"1px solid #1e2a40",
              color:cursor===0?"#2a3a50":"#ff6b6b",fontSize:22,cursor:cursor===0?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
            ‹‹
          </button>
          <button onClick={doneSet} disabled={restRun}
            style={{flex:1,height:56,borderRadius:14,
              background:restRun?"#1a2535":`linear-gradient(135deg,${planColor},#0055cc)`,
              border:"none",color:restRun?"#334":"#000",fontWeight:900,fontSize:16,cursor:restRun?"not-allowed":"pointer",
              letterSpacing:1,transition:"background 0.2s"}}>
            {isLastSet?"完成訓練 ✓":"完成這組 →"}
          </button>
          <button onClick={()=>setCursor(c=>Math.min(flat.length-1,c+1))} disabled={cursor===flat.length-1}
            style={{width:48,height:48,borderRadius:12,background:"#0e1a2e",border:"1px solid #1e2a40",
              color:cursor===flat.length-1?"#2a3a50":"#ff6b6b",fontSize:22,cursor:cursor===flat.length-1?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
            ››
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Log Page ─────────────────────────────────────────────────────────────────
function LogPage({ data, setData, plans }) {
  const [date,       setDate]      = useState(todayStr());
  const [sessions,   setSessions_] = useState([]);
  const [planName,   setPlanName]  = useState("");
  const [planColor,  setPlanColor] = useState("#00e5ff");
  const [showPicker, setShowPicker]= useState(false);
  const [active,     setActive]    = useState(false);

  useEffect(()=>{
    const rec=data[date];
    if(rec&&rec.sessions){ setSessions_(rec.sessions); setPlanName(rec.planName||""); setPlanColor(rec.planColor||"#00e5ff"); }
    else { setSessions_([]); setPlanName(""); setPlanColor("#00e5ff"); }
    setActive(false);
  },[date]);

  const persist = useCallback((ses,pn,pc)=>{
    const all=LS.get("wt_data",{});
    all[date]={sessions:ses,planName:pn,planColor:pc};
    LS.set("wt_data",all); setData(all);
  },[date]);

  const setSessions = useCallback((ns,pn=planName,pc=planColor)=>{ setSessions_(ns); persist(ns,pn,pc); },[planName,planColor,persist]);

  const selectPlan = (plan) => {
    const ns=plan.exercises.map(ex=>({
      exercise:ex.name,
      restSec:ex.restSec||90,
      mode:ex.mode||"normal",
      superPair:ex.superPair||"",
      unilateral:ex.unilateral||false,
      sets:ex.sets.map(s=>({weight:+s.weight||0,reps:+s.reps||0,warmup:s.warmup||false,done:false,weightR:+s.weightR||0}))
    }));
    setSessions_(ns); setPlanName(plan.name); setPlanColor(plan.color);
    persist(ns,plan.name,plan.color); setShowPicker(false);
  };

  const deleteSession=(si)=>setSessions(sessions.filter((_,i)=>i!==si));

  const totalVol=sessions.reduce((a,s)=>a+s.sets.reduce((b,set)=>b+(set.weight||0)*(set.reps||0),0),0);
  const doneSets=sessions.reduce((a,s)=>a+s.sets.filter(set=>set.done).length,0);
  const totalSets=sessions.reduce((a,s)=>a+s.sets.length,0);

  if(active) return (
    <ActiveWorkout sessions={sessions} setSessions={(ns)=>setSessions(ns)} planName={planName} planColor={planColor}
      data={data} date={date} onFinish={()=>setActive(false)}/>
  );

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {showPicker&&<PlanSelectModal plans={plans} onSelect={selectPlan} onCancel={()=>setShowPicker(false)}/>}

      {/* Date + plan */}
      <div style={{background:"#0e1420",borderRadius:12,padding:"12px 14px",border:"1px solid #1e2a40"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1}}>
            <div style={{color:"#334",fontSize:11,marginBottom:2}}>訓練日期</div>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}
              style={{background:"transparent",border:"none",color:"#fff",fontSize:16,fontWeight:800,cursor:"pointer",padding:0}}/>
          </div>
          <button onClick={()=>setShowPicker(true)}
            style={{background:planName?`${planColor}15`:"#111827",border:`1px solid ${planName?planColor+"44":"#2a3a50"}`,borderRadius:10,padding:"7px 12px",cursor:"pointer",textAlign:"right",flexShrink:0}}>
            {planName?<div style={{color:planColor,fontWeight:700,fontSize:13}}>{planName}</div>:<div style={{color:"#445",fontSize:13}}>選擇課表 ›</div>}
            <div style={{color:"#334",fontSize:10,marginTop:1}}>點擊切換</div>
          </button>
        </div>
        {totalSets>0&&(
          <div style={{marginTop:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
              <span style={{color:"#334",fontSize:11}}>完成進度</span>
              <span style={{color:doneSets===totalSets?"#22c55e":"#aab",fontSize:11,fontWeight:700}}>{doneSets}/{totalSets} 組</span>
            </div>
            <div style={{background:"#0a0e18",borderRadius:99,height:5}}>
              <div style={{background:doneSets===totalSets?"linear-gradient(90deg,#22c55e,#16a34a)":`linear-gradient(90deg,${planColor},#0055cc)`,borderRadius:99,height:"100%",width:`${totalSets>0?(doneSets/totalSets)*100:0}%`,transition:"width 0.3s"}}/>
            </div>
          </div>
        )}
      </div>

      {/* Empty state */}
      {sessions.length===0&&(
        <div style={{background:"#080e18",borderRadius:14,padding:32,textAlign:"center",border:"1px dashed #1a2535"}}>
          <div style={{fontSize:36,marginBottom:10}}>📋</div>
          <div style={{color:"#445",fontWeight:700,fontSize:15,marginBottom:6}}>今天練什麼？</div>
          <button onClick={()=>setShowPicker(true)}
            style={{background:`linear-gradient(135deg,#00e5ff,#0077cc)`,border:"none",borderRadius:10,color:"#000",fontWeight:800,fontSize:14,padding:"11px 28px",cursor:"pointer"}}>
            選擇課表
          </button>
        </div>
      )}

      {/* Start workout button */}
      {sessions.length>0&&(
        <button onClick={()=>setActive(true)}
          style={{background:`linear-gradient(135deg,${planColor},#0055cc)`,border:"none",borderRadius:14,
            color:"#000",fontWeight:900,fontSize:16,padding:"16px",cursor:"pointer",letterSpacing:1,
            boxShadow:`0 4px 24px ${planColor}33`}}>
          ▶ 開始訓練
        </button>
      )}

      {/* Volume */}
      {totalVol>0&&(
        <div style={{background:"#0a1018",borderRadius:9,padding:"8px 14px",border:"1px solid #1a2535",display:"flex",alignItems:"center"}}>
          <span style={{color:"#445",fontSize:12}}>今日累積</span>
          <span style={{color:"#f0a500",fontWeight:800,fontSize:18,marginLeft:"auto"}}>{totalVol.toLocaleString()}</span>
          <span style={{color:"#445",fontSize:12,marginLeft:4}}>kg</span>
        </div>
      )}

      {/* Session list (overview) */}
      {sessions.map((s,si)=>{
        const sesVol=s.sets.reduce((a,set)=>a+(set.weight||0)*(set.reps||0),0);
        const allDone=s.sets.every(set=>set.done);
        return (
          <div key={si} style={{background:"#0e1420",borderRadius:12,padding:"12px 14px",border:`1px solid ${allDone?"#22c55e33":"#1e2a40"}`}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:28,height:28,borderRadius:8,background:allDone?"#22c55e18":`${planColor}12`,
                border:`1px solid ${allDone?"#22c55e44":planColor+"33"}`,display:"flex",alignItems:"center",justifyContent:"center",
                color:allDone?"#22c55e":planColor,fontSize:13,fontWeight:800,flexShrink:0}}>
                {allDone?"✓":si+1}
              </div>
              <div style={{flex:1}}>
                <div style={{color:"#d0d8e8",fontWeight:700,fontSize:14}}>{s.exercise}</div>
                <div style={{color:"#445",fontSize:11,marginTop:2}}>
                  {s.sets.map((set,j)=>`${set.weight}×${set.reps}`).join("  ")}
                </div>
              </div>
              <span style={{color:"#f0a500",fontSize:12,fontWeight:600}}>{sesVol>0?sesVol.toLocaleString()+"kg":""}</span>
              <button onClick={()=>deleteSession(si)} style={{background:"none",border:"none",color:"#2a3a50",fontSize:18,cursor:"pointer",padding:0,lineHeight:1}}>×</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── History Page ─────────────────────────────────────────────────────────────
function HistoryPage({ data, setData }) {
  const [confirm, setConfirm] = useState(null); // date to confirm delete

  const entries = Object.entries(data)
    .filter(([,rec])=>(rec.sessions||rec||[]).length>0)
    .sort((a,b)=>b[0].localeCompare(a[0]));

  const deleteEntry = (date) => {
    const all = LS.get("wt_data",{});
    delete all[date];
    LS.set("wt_data",all); setData(all); setConfirm(null);
  };

  if(entries.length===0) return (
    <div style={{textAlign:"center",padding:40}}>
      <div style={{fontSize:36,marginBottom:10}}>📭</div>
      <div style={{color:"#445",fontSize:14}}>尚無訓練紀錄</div>
    </div>
  );

  return (
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {confirm&&(
        <div style={{position:"fixed",inset:0,background:"#000000cc",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:24}}>
          <div style={{background:"#0d1422",borderRadius:16,padding:24,width:"100%",maxWidth:340,border:"1px solid #ff4d6d44"}}>
            <div style={{color:"#fff",fontWeight:700,fontSize:16,marginBottom:8}}>刪除 {confirm} 的紀錄？</div>
            <div style={{color:"#556",fontSize:13,marginBottom:20}}>刪除後無法復原</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setConfirm(null)} style={{flex:1,background:"#111827",border:"1px solid #2a3a50",borderRadius:8,color:"#778",fontSize:14,padding:"10px",cursor:"pointer"}}>取消</button>
              <button onClick={()=>deleteEntry(confirm)} style={{flex:1,background:"#ff4d6d18",border:"1px solid #ff4d6d55",borderRadius:8,color:"#ff4d6d",fontWeight:700,fontSize:14,padding:"10px",cursor:"pointer"}}>刪除</button>
            </div>
          </div>
        </div>
      )}
      <div style={{color:"#334",fontSize:12,marginBottom:4}}>共 {entries.length} 筆紀錄・點垃圾桶刪除</div>
      {entries.map(([date,rec])=>{
        const sessions=Array.isArray(rec)?rec:(rec.sessions||[]);
        const planName=rec.planName||"";
        const planColor=rec.planColor||"#00e5ff";
        const vol=sessions.reduce((a,s)=>a+s.sets.reduce((b,set)=>b+(set.weight||0)*(set.reps||0),0),0);
        const sets=sessions.reduce((a,s)=>a+s.sets.length,0);
        const [y,mo,day]=date.split("-");
        return (
          <div key={date} style={{background:"#0e1420",borderRadius:12,padding:"12px 14px",border:`1px solid ${planColor}22`}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{flexShrink:0,textAlign:"center",width:36}}>
                <div style={{color:planColor,fontWeight:900,fontSize:16}}>{day}</div>
                <div style={{color:"#445",fontSize:10}}>{y}/{mo}</div>
              </div>
              <div style={{flex:1,minWidth:0}}>
                {planName&&<div style={{color:planColor,fontWeight:700,fontSize:12,marginBottom:2}}>{planName}</div>}
                <div style={{color:"#667",fontSize:11,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {sessions.map(s=>s.exercise).join("・")}
                </div>
                <div style={{color:"#334",fontSize:11,marginTop:1}}>{sets} 組・{vol.toLocaleString()} kg</div>
              </div>
              <button onClick={()=>setConfirm(date)}
                style={{background:"#ff4d6d0a",border:"1px solid #ff4d6d22",borderRadius:8,color:"#ff4d6d66",fontSize:16,
                  width:34,height:34,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                🗑
              </button>
            </div>
          </div>
        );
      })}
      <button onClick={()=>exportCSV(data)}
        style={{background:"#0e2010",border:"1px solid #22c55e33",borderRadius:12,color:"#22c55e",fontSize:14,fontWeight:800,padding:"14px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginTop:4}}>
        📊 匯出 CSV
      </button>
    </div>
  );
}

            <button key={ex.name} onClick={()=>onSelect(ex.name)}
              style={{background:"#0e1420",border:"1px solid #1e2a40",borderRadius:10,padding:"11px 14px",cursor:"pointer",
                display:"flex",alignItems:"center",gap:10,textAlign:"left"}}>
              <div style={{width:34,height:34,borderRadius:8,background:"#00e5ff0a",border:"1px solid #1e2a40",
                display:"flex",alignItems:"center",justifyContent:"center",color:"#445",fontSize:10,fontWeight:700,flexShrink:0}}>
                {ex.muscle}
              </div>
              <span style={{color:"#d0d8e8",fontWeight:600,fontSize:14}}>{ex.name}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── Exercise Database Page ───────────────────────────────────────────────────
function ExerciseDBPage() {
  const [exercises, setExercises] = useState(()=>LS.get("wt_exercises", DEFAULT_EXERCISES));
  const [filter,    setFilter]    = useState("全部");
  const [search,    setSearch]    = useState("");
  const [adding,    setAdding]    = useState(false);
  const [newName,   setNewName]   = useState("");
  const [newMuscle, setNewMuscle] = useState("胸");
  const [editIdx,   setEditIdx]   = useState(null);

  const persist = (ex) => { setExercises(ex); LS.set("wt_exercises",ex); };

  const addExercise = () => {
    if(!newName.trim()) return;
    if(exercises.find(e=>e.name===newName.trim())) return;
    persist([...exercises, {name:newName.trim(), muscle:newMuscle}]);
    setNewName(""); setAdding(false);
  };

  const deleteEx = (i) => persist(exercises.filter((_,idx)=>idx!==i));

  const list = exercises.filter(e =>
    (filter==="全部"||e.muscle===filter) && (!search||e.name.includes(search))
  );

  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{color:"#334",fontSize:12}}>自訂動作資料庫，編輯課表時直接選取</div>

      {/* Search + filter */}
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋動作..."
        style={{background:"#0e1420",border:"1px solid #1e2a40",borderRadius:9,color:"#fff",fontSize:13,padding:"9px 12px"}}/>
      <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:2}}>
        {MUSCLES.map(m=>(
          <button key={m} onClick={()=>setFilter(m)}
            style={{background:filter===m?"#00e5ff18":"#0e1420",border:`1px solid ${filter===m?"#00e5ff44":"#2a3a50"}`,
              borderRadius:20,color:filter===m?"#00e5ff":"#556",fontSize:11,padding:"4px 10px",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
            {m}
          </button>
        ))}
      </div>

      {/* Add new */}
      {adding ? (
        <div style={{background:"#0e1420",borderRadius:12,padding:14,border:"1px solid #00e5ff33",display:"flex",flexDirection:"column",gap:10}}>
          <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)} placeholder="動作名稱"
            style={{background:"#080e1a",border:"1px solid #2a3a50",borderRadius:8,color:"#fff",fontSize:14,padding:"9px 12px"}}
            onKeyDown={e=>e.key==="Enter"&&addExercise()}/>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {MUSCLES.filter(m=>m!=="全部").map(m=>(
              <button key={m} onClick={()=>setNewMuscle(m)}
                style={{background:newMuscle===m?"#00e5ff18":"#080e1a",border:`1px solid ${newMuscle===m?"#00e5ff55":"#2a3a50"}`,
                  borderRadius:20,color:newMuscle===m?"#00e5ff":"#556",fontSize:12,padding:"4px 12px",cursor:"pointer"}}>
                {m}
              </button>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={addExercise}
              style={{flex:1,background:"linear-gradient(135deg,#00e5ff,#0077cc)",border:"none",borderRadius:8,color:"#000",fontWeight:800,fontSize:13,padding:"9px",cursor:"pointer"}}>
              新增
            </button>
            <button onClick={()=>setAdding(false)}
              style={{background:"#111827",border:"1px solid #2a3a50",borderRadius:8,color:"#556",fontSize:13,padding:"9px 16px",cursor:"pointer"}}>
              取消
            </button>
          </div>
        </div>
      ) : (
        <button onClick={()=>setAdding(true)}
          style={{background:"#00e5ff08",border:"1px dashed #00e5ff33",borderRadius:12,color:"#00e5ff66",fontSize:13,padding:"12px",cursor:"pointer"}}>
          ＋ 新增動作
        </button>
      )}

      {/* List */}
      <div style={{color:"#334",fontSize:11}}>{list.length} 個動作</div>
      {list.map((ex,i)=>{
        const realIdx = exercises.indexOf(ex);
        return (
          <div key={ex.name} style={{background:"#0e1420",borderRadius:10,padding:"10px 14px",border:"1px solid #1e2a40",display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:34,height:34,borderRadius:8,background:"#00e5ff0a",border:"1px solid #1e2a40",
              display:"flex",alignItems:"center",justifyContent:"center",color:"#445",fontSize:10,fontWeight:700,flexShrink:0}}>
              {ex.muscle}
            </div>
            <span style={{color:"#d0d8e8",fontWeight:600,fontSize:13,flex:1}}>{ex.name}</span>
            <button onClick={()=>deleteEx(realIdx)}
              style={{background:"none",border:"none",color:"#2a3a50",fontSize:18,cursor:"pointer",padding:0,lineHeight:1}}>×</button>
          </div>
        );
      })}
    </div>
  );
}

const EMOJIS=["🔴","🔵","🟡","🟢","🟠","🟣","⚫","🟤"];
const COLORS =["#ff6b6b","#4ecdc4","#ffd93d","#6bcb77","#ff9f43","#a855f7","#888","#c67c4e"];

function PlanEditor({ plan, onSave, onDelete, onBack, exercises }) {
  const [draft,setDraft]=useState(JSON.parse(JSON.stringify(plan)));
  const [showPicker, setShowPicker]=useState(null); // ei index
  const sf=(f,v)=>setDraft(d=>({...d,[f]:v}));
  const addEx=()=>setDraft(d=>({...d,exercises:[...d.exercises,{name:"",restSec:90,sets:[{weight:"",reps:""}]}]}));
  const removeEx=(ei)=>setDraft(d=>({...d,exercises:d.exercises.filter((_,i)=>i!==ei)}));
  const seName=(ei,v)=>setDraft(d=>({...d,exercises:d.exercises.map((e,i)=>i===ei?{...e,name:v}:e)}));
  const seRest=(ei,v)=>setDraft(d=>({...d,exercises:d.exercises.map((e,i)=>i===ei?{...e,restSec:v===""?"":+v}:e)}));
  const seMode=(ei,v)=>setDraft(d=>({...d,exercises:d.exercises.map((e,i)=>i===ei?{...e,mode:v}:e)}));
  const sePair=(ei,v)=>setDraft(d=>({...d,exercises:d.exercises.map((e,i)=>i===ei?{...e,superPair:v}:e)}));
  const seUnilateral=(ei,v)=>setDraft(d=>({...d,exercises:d.exercises.map((e,i)=>i===ei?{...e,unilateral:v}:e)}));
  const addSet=(ei)=>setDraft(d=>({...d,exercises:d.exercises.map((e,i)=>{
    if(i!==ei) return e;
    const last=e.sets.slice(-1)[0]||{weight:"",reps:"",warmup:false};
    const mode=e.mode||"normal";
    let newW=last.weight;
    if(mode==="dropset"&&+last.weight>0) newW=Math.round((+last.weight*0.9)/2.5)*2.5;
    if(mode==="pyramid"){
      const n=e.sets.length;
      const mid=Math.floor(n/2);
      newW=n<=mid?Math.round((+last.weight*1.1)/2.5)*2.5:Math.round((+last.weight*0.9)/2.5)*2.5;
    }
    return {...e,sets:[...e.sets,{weight:newW,reps:last.reps,warmup:false}]};
  })}));
  const remSet=(ei,si)=>setDraft(d=>({...d,exercises:d.exercises.map((e,i)=>i===ei?{...e,sets:e.sets.filter((_,j)=>j!==si)}:e)}));
  const ssv=(ei,si,f,v)=>setDraft(d=>({...d,exercises:d.exercises.map((e,i)=>i===ei?{...e,sets:e.sets.map((s,j)=>j===si?{...s,[f]:v}:s)}:e)}));
  const toggleWarmup=(ei,si)=>setDraft(d=>({...d,exercises:d.exercises.map((e,i)=>i===ei?{...e,sets:e.sets.map((s,j)=>j===si?{...s,warmup:!s.warmup}:s)}:e)}));

  const MODE_OPTIONS=[
    {id:"normal",  label:"一般",   color:"#445"},
    {id:"warmup",  label:"暖身組", color:"#f0a500"},
    {id:"superset",label:"超級組", color:"#a855f7"},
    {id:"dropset", label:"遞減組", color:"#ff6b6b"},
    {id:"pyramid", label:"金字塔", color:"#4ecdc4"},
    {id:"unilateral",label:"單邊", color:"#6bcb77"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",gap:0}}>
      {showPicker!==null&&(
        <ExercisePicker exercises={exercises} title="選擇動作" onClose={()=>setShowPicker(null)}
          onSelect={name=>{seName(showPicker,name);setShowPicker(null);}}/>
      )}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        <button onClick={onBack} style={{background:"#0e1420",border:"1px solid #1e2a40",borderRadius:8,color:"#778",fontSize:13,padding:"6px 12px",cursor:"pointer"}}>← 返回</button>
        <div style={{color:"#d0d8e8",fontWeight:800,fontSize:16,flex:1}}>編輯課表</div>
        <button onClick={()=>onSave(draft)} style={{background:`linear-gradient(135deg,${draft.color},#0055cc)`,border:"none",borderRadius:8,color:"#000",fontWeight:800,fontSize:13,padding:"7px 18px",cursor:"pointer"}}>儲存</button>
      </div>
      <div style={{background:"#0e1420",borderRadius:12,padding:14,marginBottom:12,border:"1px solid #1e2a40"}}>
        <div style={{display:"flex",gap:10,marginBottom:12}}>
          <div style={{flex:1}}>
            <div style={{color:"#445",fontSize:11,marginBottom:4}}>課表名稱</div>
            <input value={draft.name} onChange={e=>sf("name",e.target.value)} placeholder="如：Push 推"
              style={{width:"100%",background:"#080e1a",border:"1px solid #1e2a40",borderRadius:8,color:"#fff",fontSize:14,padding:"9px",boxSizing:"border-box"}}/>
          </div>
          <div>
            <div style={{color:"#445",fontSize:11,marginBottom:4}}>圖示</div>
            <select value={draft.emoji} onChange={e=>sf("emoji",e.target.value)}
              style={{background:"#080e1a",border:"1px solid #1e2a40",borderRadius:8,color:"#fff",fontSize:18,padding:"8px",width:60}}>
              {EMOJIS.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
          </div>
        </div>
        <div style={{color:"#445",fontSize:11,marginBottom:6}}>顏色</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {COLORS.map((c,i)=>(
            <div key={c} onClick={()=>{sf("color",c);sf("emoji",EMOJIS[i]);}}
              style={{width:28,height:28,borderRadius:"50%",background:c,cursor:"pointer",border:draft.color===c?"2px solid #fff":"2px solid transparent",boxSizing:"border-box"}}/>
          ))}
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {draft.exercises.map((ex,ei)=>{
          const mode=ex.mode||"normal";
          const modeInfo=MODE_OPTIONS.find(m=>m.id===mode)||MODE_OPTIONS[0];
          const otherExercises=draft.exercises.filter((_,i)=>i!==ei).map(e=>e.name).filter(Boolean);
          return (
          <div key={ei} style={{background:"#0e1420",borderRadius:12,padding:14,border:`1px solid ${modeInfo.color}33`}}>
            {/* Name row */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <div style={{width:24,height:24,borderRadius:6,background:`${modeInfo.color}18`,border:`1px solid ${modeInfo.color}44`,
                display:"flex",alignItems:"center",justifyContent:"center",color:modeInfo.color,fontSize:12,fontWeight:800,flexShrink:0}}>{ei+1}</div>
              <div style={{flex:1,display:"flex",gap:6}}>
                <input value={ex.name} onChange={e=>seName(ei,e.target.value)} placeholder="輸入動作名稱"
                  style={{flex:1,background:"#080e1a",border:"1px solid #1e2a40",borderRadius:7,color:"#fff",fontSize:13,padding:"7px 10px"}}/>
                <button onClick={()=>setShowPicker(ei)}
                  style={{background:"#00e5ff0a",border:"1px solid #00e5ff33",borderRadius:7,color:"#00e5ff",fontSize:11,padding:"6px 10px",cursor:"pointer",whiteSpace:"nowrap"}}>
                  選 DB
                </button>
              </div>
              <button onClick={()=>removeEx(ei)} style={{background:"#ff4d6d0a",border:"1px solid #ff4d6d33",borderRadius:6,color:"#ff4d6d",fontSize:12,padding:"4px 10px",cursor:"pointer"}}>移除</button>
            </div>

            {/* Mode selector */}
            <div style={{marginBottom:10}}>
              <div style={{color:"#445",fontSize:11,marginBottom:6}}>訓練模式</div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {MODE_OPTIONS.map(m=>(
                  <button key={m.id} onClick={()=>seMode(ei,m.id)}
                    style={{background:mode===m.id?`${m.color}20`:"#080e1a",
                      border:`1px solid ${mode===m.id?m.color+"66":"#2a3a50"}`,
                      borderRadius:20,color:mode===m.id?m.color:"#445",
                      fontSize:11,padding:"3px 10px",cursor:"pointer",fontWeight:mode===m.id?700:400}}>
                    {m.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Mode-specific options */}
            {mode==="superset"&&(
              <div style={{background:"#080e1a",borderRadius:8,padding:"8px 12px",marginBottom:10,border:"1px solid #a855f733"}}>
                <div style={{color:"#a855f7",fontSize:11,marginBottom:6}}>⚡ 配對動作（和哪個動作交替做）</div>
                {otherExercises.length===0
                  ? <div style={{color:"#445",fontSize:11}}>請先新增其他動作</div>
                  : <select value={ex.superPair||""} onChange={e=>sePair(ei,e.target.value)}
                      style={{width:"100%",background:"#0a0f1c",border:"1px solid #a855f744",borderRadius:6,color:"#a855f7",fontSize:13,padding:"6px"}}>
                      <option value="">選擇配對動作...</option>
                      {otherExercises.map(n=><option key={n} value={n}>{n}</option>)}
                    </select>
                }
              </div>
            )}
            {mode==="unilateral"&&(
              <div style={{background:"#080e1a",borderRadius:8,padding:"8px 12px",marginBottom:10,border:"1px solid #6bcb7733"}}>
                <div style={{color:"#6bcb77",fontSize:11}}>↔ 單邊模式：訓練時左右各記一次重量</div>
              </div>
            )}
            {mode==="dropset"&&(
              <div style={{background:"#080e1a",borderRadius:8,padding:"8px 12px",marginBottom:10,border:"1px solid #ff6b6b33"}}>
                <div style={{color:"#ff6b6b",fontSize:11}}>↘ 遞減模式：加一組時自動建議 -10% 重量，組間不休息</div>
              </div>
            )}
            {mode==="pyramid"&&(
              <div style={{background:"#080e1a",borderRadius:8,padding:"8px 12px",marginBottom:10,border:"1px solid #4ecdc433"}}>
                <div style={{color:"#4ecdc4",fontSize:11}}>△ 金字塔：重量先升後降，加組時自動建議</div>
              </div>
            )}
            {mode==="warmup"&&(
              <div style={{background:"#080e1a",borderRadius:8,padding:"8px 12px",marginBottom:10,border:"1px solid #f0a50033"}}>
                <div style={{color:"#f0a500",fontSize:11}}>🔥 暖身模式：可單獨標記某幾組為暖身組（不計入統計）</div>
              </div>
            )}

            {/* Rest time */}
            {mode!=="dropset"&&(
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,background:"#080e1a",borderRadius:8,padding:"8px 12px"}}>
                <span style={{fontSize:13}}>⏱</span>
                <span style={{color:"#445",fontSize:12,flex:1}}>組間休息</span>
                <input type="number" value={ex.restSec===undefined?"90":ex.restSec}
                  onChange={e=>seRest(ei,e.target.value)} onFocus={e=>e.target.select()}
                  style={{width:54,background:"#0a0f1c",border:"1px solid #1e2a40",borderRadius:6,color:draft.color,fontSize:14,fontWeight:700,padding:"4px 6px",textAlign:"center"}}/>
                <span style={{color:"#445",fontSize:12}}>秒</span>
              </div>
            )}
            {mode==="dropset"&&(
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,background:"#080e1a",borderRadius:8,padding:"8px 12px"}}>
                <span style={{fontSize:13}}>⏱</span>
                <span style={{color:"#ff6b6b",fontSize:12}}>遞減組組間不休息（立刻換重量繼續）</span>
              </div>
            )}

            {/* Sets */}
            <div style={{display:"grid",gridTemplateColumns:`${mode==="warmup"?"40px":"22px"} 1fr 1fr 58px 22px`,gap:6,color:"#334",fontSize:11,marginBottom:6,paddingLeft:2}}>
              {mode==="warmup"&&<span>暖身</span>}
              {mode!=="warmup"&&<span>組</span>}
              <span>{mode==="unilateral"?"左重量(kg)":"目標重量(kg)"}</span>
              <span>{mode==="unilateral"?"右重量(kg)":"目標次數"}</span>
              <span>預估量</span><span></span>
            </div>
            {ex.sets.map((set,si)=>{
              const isWarmup=set.warmup||false;
              return (
              <div key={si} style={{display:"grid",gridTemplateColumns:`${mode==="warmup"?"40px":"22px"} 1fr 1fr 58px 22px`,gap:6,alignItems:"center",marginBottom:6}}>
                {mode==="warmup"
                  ? <button onClick={()=>toggleWarmup(ei,si)}
                      style={{height:24,borderRadius:20,background:isWarmup?"#f0a50020":"#080e1a",border:`1px solid ${isWarmup?"#f0a50066":"#2a3a50"}`,
                        color:isWarmup?"#f0a500":"#334",fontSize:9,cursor:"pointer",padding:"0 4px"}}>
                      {isWarmup?"暖身":"正式"}
                    </button>
                  : <span style={{color:"#334",fontSize:11,textAlign:"center"}}>{si+1}</span>
                }
                <input type="number" placeholder="0" value={set.weight} onChange={e=>ssv(ei,si,"weight",e.target.value)} onFocus={e=>e.target.select()}
                  style={{background:isWarmup?"#1a1200":"#080e1a",border:`1px solid ${isWarmup?"#f0a50033":"#1a2535"}`,borderRadius:6,color:isWarmup?"#f0a500":"#fff",fontSize:13,padding:"6px",textAlign:"center"}}/>
                {mode==="unilateral"
                  ? <input type="number" placeholder="0" value={set.weightR||set.weight} onChange={e=>ssv(ei,si,"weightR",e.target.value)} onFocus={e=>e.target.select()}
                      style={{background:"#080e1a",border:"1px solid #1a2535",borderRadius:6,color:"#6bcb77",fontSize:13,padding:"6px",textAlign:"center"}}/>
                  : <input type="number" placeholder="0" value={set.reps} onChange={e=>ssv(ei,si,"reps",e.target.value)} onFocus={e=>e.target.select()}
                      style={{background:isWarmup?"#1a1200":"#080e1a",border:`1px solid ${isWarmup?"#f0a50033":"#1a2535"}`,borderRadius:6,color:isWarmup?"#f0a500":"#fff",fontSize:13,padding:"6px",textAlign:"center"}}/>
                }
                <span style={{color:isWarmup?"#f0a50088":"#f0a500",fontSize:11,textAlign:"center",fontWeight:600}}>
                  {mode==="unilateral"
                    ? (set.weight&&set.reps?`L${set.weight}`:"—")
                    : (set.weight&&set.reps?(+set.weight*(+set.reps))+"":"—")
                  }
                </span>
                <button onClick={()=>remSet(ei,si)} style={{background:"none",border:"none",color:"#2a3a50",cursor:"pointer",fontSize:15,padding:0}}>×</button>
              </div>
              );
            })}
            <button onClick={()=>addSet(ei)} style={{width:"100%",background:"transparent",border:"1px dashed #1a2535",borderRadius:6,color:"#334",fontSize:12,padding:"5px",cursor:"pointer",marginTop:2}}>＋ 加一組</button>
          </div>
          );
        })}
        <button onClick={addEx} style={{background:`${draft.color}06`,border:`1px dashed ${draft.color}2a`,borderRadius:12,color:`${draft.color}66`,fontSize:13,padding:"12px",cursor:"pointer"}}>＋ 新增動作</button>
        {onDelete&&<button onClick={onDelete} style={{background:"#ff4d6d08",border:"1px solid #ff4d6d22",borderRadius:10,color:"#ff4d6d88",fontSize:13,padding:"10px",cursor:"pointer"}}>刪除這個課表</button>}
      </div>
    </div>
  );
}

function PlansPage({ plans, setPlans }) {
  const [editing,setEditing]=useState(null);
  const exercises = LS.get("wt_exercises", DEFAULT_EXERCISES);
  const savePlan=(draft)=>{ const np=editing==="new"?[...plans,{...draft,id:Date.now().toString()}]:plans.map((p,i)=>i===editing?draft:p); setPlans(np); LS.set("wt_plans",np); setEditing(null); };
  const deletePlan=()=>{ const np=plans.filter((_,i)=>i!==editing); setPlans(np); LS.set("wt_plans",np); setEditing(null); };
  if(editing!==null){
    const plan=editing==="new"?{id:"new",name:"",emoji:"🔴",color:"#ff6b6b",exercises:[]}:plans[editing];
    return <PlanEditor plan={plan} onSave={savePlan} onDelete={editing!=="new"?deletePlan:null} onBack={()=>setEditing(null)} exercises={exercises}/>;
  }
  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{color:"#334",fontSize:12,marginBottom:4}}>管理訓練課表，訓練時直接選取</div>
      {plans.map((p,i)=>{
        const ts=p.exercises.reduce((a,e)=>a+e.sets.length,0);
        const ev=p.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.weight||0)*(+s.reps||0),0),0);
        return (
          <div key={p.id} onClick={()=>setEditing(i)} style={{background:"#0e1420",borderRadius:12,padding:"13px 14px",cursor:"pointer",border:`1px solid ${p.color}22`}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:44,height:44,borderRadius:12,background:`${p.color}15`,border:`1px solid ${p.color}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{p.emoji}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{color:"#e0e8f0",fontWeight:800,fontSize:15}}>{p.name}</div>
                <div style={{color:"#445",fontSize:11,marginTop:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.exercises.map(e=>e.name).filter(Boolean).join("・")||"尚未設定動作"}</div>
                <div style={{color:"#334",fontSize:11,marginTop:1}}>{ts} 組・預估 {ev.toLocaleString()} kg</div>
              </div>
              <span style={{color:p.color,fontSize:20}}>›</span>
            </div>
          </div>
        );
      })}
      <button onClick={()=>setEditing("new")} style={{background:"#00e5ff06",border:"1px dashed #00e5ff2a",borderRadius:12,color:"#00e5ff66",fontSize:14,padding:"14px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>＋ 新增課表</button>
    </div>
  );
}

// ─── Exercise History Chart ───────────────────────────────────────────────────
function ExerciseHistoryChart({ data, exName, onClose }) {
  // Collect max weight per session date for this exercise
  const points = [];
  Object.entries(data).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,rec])=>{
    const sessions = Array.isArray(rec)?rec:(rec.sessions||[]);
    const found = sessions.find(s=>s.exercise===exName);
    if(!found) return;
    const maxW = Math.max(...found.sets.map(s=>s.weight||0));
    if(maxW>0) points.push({date, weight:maxW});
  });

  if(points.length===0) return (
    <div style={{position:"fixed",inset:0,background:"#000000ee",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}}>
      <div style={{background:"#0d1422",borderRadius:16,padding:24,width:"100%",maxWidth:400,border:"1px solid #1e2a40",textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:10}}>📭</div>
        <div style={{color:"#aab",fontWeight:700,fontSize:15,marginBottom:6}}>{exName}</div>
        <div style={{color:"#445",fontSize:13,marginBottom:20}}>尚無歷史紀錄</div>
        <button onClick={onClose} style={{background:"#0e1420",border:"1px solid #2a3a50",borderRadius:8,color:"#778",fontSize:13,padding:"8px 24px",cursor:"pointer"}}>關閉</button>
      </div>
    </div>
  );

  const maxVal = Math.max(...points.map(p=>p.weight));
  const minVal = Math.min(...points.map(p=>p.weight));
  const range  = maxVal - minVal || 1;
  const W=300, H=120, PAD=10;
  const xs = points.map((_,i)=> PAD + (i/(Math.max(points.length-1,1)))*(W-PAD*2));
  const ys = points.map(p=> H - PAD - ((p.weight-minVal)/range)*(H-PAD*2));
  const path = xs.map((x,i)=>`${i===0?"M":"L"}${x},${ys[i]}`).join(" ");
  const area = `${path} L${xs[xs.length-1]},${H-PAD} L${xs[0]},${H-PAD} Z`;

  const pr = points.reduce((a,b)=>b.weight>a.weight?b:a);
  const latest = points[points.length-1];
  const prev   = points[points.length-2];
  const trend  = prev ? latest.weight - prev.weight : 0;

  return (
    <div style={{position:"fixed",inset:0,background:"#000000ee",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}}>

// ─── Barbell Calculator ───────────────────────────────────────────────────────
const PLATES   = [25, 20, 10, 5, 2.5, 1.25];
const BARS     = [{name:"標準槓",kg:20},{name:"W槓",kg:9.7}];

function calcPlates(target, barKg) {
  let rem = Math.max(0, (target - barKg) / 2);
  const result = [];
  for(const p of PLATES) {
    const n = Math.floor(rem / p);
    if(n > 0) { result.push({kg:p, count:n}); rem = Math.round((rem - n*p)*100)/100; }
  }
  return result;
}

function BarbellCalc({ initWeight=0, onClose }) {
  const [target,  setTarget]  = useState(initWeight||0);
  const [barIdx,  setBarIdx]  = useState(0);
  const bar    = BARS[barIdx];
  const plates = calcPlates(target, bar.kg);
  const actual = bar.kg + plates.reduce((a,p)=>a+p.kg*p.count*2, 0);

  const PLATE_COLORS = {25:"#ff6b6b",20:"#4ecdc4",10:"#ffd93d",5:"#6bcb77",2.5:"#a855f7",1.25:"#888"};

  return (

          {BARS.map((b,i)=>(
            <button key={b.name} onClick={()=>setBarIdx(i)}
              style={{flex:1,background:barIdx===i?"#00e5ff18":"#0e1420",border:`1px solid ${barIdx===i?"#00e5ff44":"#2a3a50"}`,
                borderRadius:9,color:barIdx===i?"#00e5ff":"#556",fontSize:13,padding:"8px",cursor:"pointer"}}>
              {b.name} <span style={{fontSize:11,opacity:0.7}}>({b.kg}kg)</span>
            </button>

        {/* Target weight input */}
        <div style={{background:"#080e18",borderRadius:12,padding:"14px 16px",marginBottom:16,border:"1px solid #1a2535"}}>

            <input type="number" value={target} onChange={e=>setTarget(parseFloat(e.target.value)||0)}
              onFocus={e=>e.target.select()}
              style={{flex:1,background:"transparent",border:"none",color:"#fff",fontSize:40,fontWeight:900,textAlign:"center"}}/>
            <button onClick={()=>setTarget(t=>Math.round((t+2.5)*10)/10)}
              style={{width:44,height:44,borderRadius:"50%",background:"#0e1a2e",border:"2px solid #00e5ff33",color:"#00e5ff",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>

          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>

            <span style={{color:Math.abs(actual-target)<0.01?"#22c55e":"#f0a500",fontSize:11,fontWeight:700}}>
              實際上槓：{actual.toFixed(2)}kg
              {Math.abs(actual-target)>0.01&&<span style={{color:"#556",fontWeight:400}}> (差 {(target-actual).toFixed(2)}kg)</span>}
            </span>
          </div>

          {/* Barbell visual */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:0,marginBottom:14,height:50}}>
            {/* left plates reversed */}
            {[...plates].reverse().map((p,i)=>(
              <div key={i} style={{width:Math.max(14,p.kg*0.8),height:30+p.kg*0.8,borderRadius:3,
                background:PLATE_COLORS[p.kg]||"#666",marginRight:2,display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:9,color:"#000",fontWeight:800,flexShrink:0}}>

                fontSize:9,color:"#000",fontWeight:800,flexShrink:0}}>
                {p.count>1&&`×${p.count}`}
              </div>
            ))}
          </div>

          {/* Plate list */}
          {plates.length===0
            ? <div style={{color:"#334",fontSize:12,textAlign:"center"}}>只有槓 ({bar.kg}kg)</div>
            : <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}}>
                {plates.map((p,i)=>(
                  <div key={i} style={{background:`${PLATE_COLORS[p.kg]}22`,border:`1px solid ${PLATE_COLORS[p.kg]}55`,
                    borderRadius:8,padding:"5px 12px",color:PLATE_COLORS[p.kg],fontWeight:700,fontSize:13}}>
                    {p.kg}kg × {p.count*2}片
                  </div>
                ))}
              </div>
          }
        </div>
      </div>
    </div>
  );
}

// Epley formula: 1RM = weight × (1 + reps/30)
function epley(weight, reps) {
  if(reps===1) return weight;
  return weight * (1 + reps/30);
}

  const [mode,    setMode]    = useState("pct");   // "pct" | "1rm"
  const [pr,      setPr]      = useState("");
  const [weight,  setWeight]  = useState("");
  const [reps,    setReps]    = useState("");
  const [round,   setRound]   = useState(2.5);

  const roundTo = (v, r) => Math.round(v/r)*r;

  const rm = mode==="pct"
    ? parseFloat(pr)||0
    : (weight&&reps ? epley(parseFloat(weight),parseInt(reps)) : 0);

  const adj = (setter, cur, delta, step=2.5, min=0) => {
    const v = (parseFloat(cur)||0) + delta*step;
    setter(String(Math.max(min, v)));

        <div style={{background:"#0e1420",borderRadius:14,padding:18,border:"1px solid #1e2a40"}}>
          <div style={{color:"#445",fontSize:11,marginBottom:10,letterSpacing:1}}>你的 1RM（kg）</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16}}>
            <button onClick={()=>adj(setPr,pr,-1,2.5)}
