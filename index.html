              <div style={{color:"#445",fontSize:11,marginBottom:6}}>次數 (Reps)</div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <button onClick={()=>adj(setReps,reps,-1,1,1)} style={{width:32,height:32,borderRadius:"50%",background:"#0e1a2e",border:"1px solid #2a3a50",color:"#aab",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                <input type="number" value={reps} onChange={e=>setReps(e.target.value)} onFocus={e=>e.target.select()} placeholder="5"
                  style={{flex:1,background:"#080e1a",border:"1px solid #2a3a50",borderRadius:8,color:"#fff",fontSize:20,fontWeight:700,textAlign:"center",padding:"8px"}}/>
                <button onClick={()=>adj(setReps,reps,1,1,1)} style={{width:32,height:32,borderRadius:"50%",background:"#0e1a2e",border:"1px solid #2a3a50",color:"#aab",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
              </div>
            </div>
          </div>
          {rm>0&&(
            <div style={{background:"#080e18",borderRadius:10,padding:"10px 14px",border:"1px solid #f0a50033",textAlign:"center"}}>
              <div style={{color:"#445",fontSize:11,marginBottom:2}}>推估 1RM（Epley 公式）</div>
              <div style={{color:"#f0a500",fontSize:28,fontWeight:900}}>{rm.toFixed(1)} <span style={{fontSize:14,color:"#556"}}>kg</span></div>
            </div>
          )}
        </div>
      )}

      {/* Rounding selector */}
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{color:"#445",fontSize:12}}>捨入單位</span>
        <div style={{display:"flex",gap:5}}>
          {[1,2.5,5].map(r=>(
            <button key={r} onClick={()=>setRound(r)}
              style={{background:round===r?"#f0a50018":"#0e1420",border:`1px solid ${round===r?"#f0a50055":"#2a3a50"}`,
                borderRadius:20,color:round===r?"#f0a500":"#556",fontSize:12,padding:"4px 12px",cursor:"pointer"}}>
              {r} kg
            </button>
          ))}
        </div>
      </div>

      {/* Percentage table */}
      {rm>0 ? (
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {PCT_ROWS.map(row=>{
            const raw   = rm * row.pct/100;
            const val   = roundTo(raw, round);
            const barW  = row.pct;
            return (
              <div key={row.pct} style={{background:"#0e1420",borderRadius:12,padding:"10px 14px",border:`1px solid ${row.color}22`,position:"relative",overflow:"hidden"}}>
                {/* background bar */}
                <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${barW}%`,background:`${row.color}08`,borderRadius:12,transition:"width 0.4s"}}/>
                <div style={{position:"relative",display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:36,flexShrink:0}}>
                    <div style={{color:row.color,fontWeight:700,fontSize:13}}>{row.pct}%</div>
                    {row.tag&&<div style={{color:row.color,fontSize:9,background:`${row.color}18`,borderRadius:10,padding:"1px 5px",display:"inline-block",marginTop:1}}>{row.tag}</div>}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{background:"#0a0e18",borderRadius:4,height:4,marginBottom:0}}>
                      <div style={{background:row.color,borderRadius:4,height:"100%",width:`${barW}%`,opacity:0.6}}/>
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <span style={{color:"#fff",fontWeight:800,fontSize:20,fontVariantNumeric:"tabular-nums"}}>{val}</span>
                    <span style={{color:"#445",fontSize:11,marginLeft:3}}>kg</span>
                    {row.pct!==100&&<div style={{color:"#334",fontSize:10,marginTop:1}}>實際 {raw.toFixed(1)}</div>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ) : (
        <div style={{background:"#0e1420",borderRadius:14,padding:32,textAlign:"center",border:"1px dashed #2a3a50"}}>
          <div style={{fontSize:32,marginBottom:8}}>🏋️</div>
          <div style={{color:"#445",fontSize:14}}>輸入你的 1RM 或做組紀錄</div>
          <div style={{color:"#334",fontSize:12,marginTop:4}}>自動計算各強度訓練重量</div>
        </div>
      )}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
export default function App() {
  const [tab,   setTab]   = useState("log");
  const [data,  setData]  = useState(()=>LS.get("wt_data",{}));
  const [plans, setPlans] = useState(()=>LS.get("wt_plans",DEFAULT_PLANS));
  const [userName, setUserName] = useState(()=>LS.get("wt_username",""));
  const [editingName, setEditingName] = useState(false);
  const [nameInput, setNameInput] = useState("");

  // Prompt for name on first open
  useEffect(()=>{
    if(!LS.get("wt_username","")) setEditingName(true);
  },[]);

  const saveName = () => {
    const n = nameInput.trim()||"Trainer";
    setUserName(n); LS.set("wt_username",n); setEditingName(false);
  };

  const tabs=[
    {id:"log",        icon:"💪",label:"訓練"},
    {id:"plans",      icon:"📋",label:"課表"},
    {id:"exercisedb", icon:"🗂",label:"動作"},
    {id:"history",    icon:"📅",label:"紀錄"},
    {id:"stats",      icon:"📊",label:"統計"},
    {id:"pr",         icon:"🏆",label:"PR"},
  ];

  return (
    <div style={{minHeight:"100vh",background:"#080e18",fontFamily:"'Noto Sans TC',sans-serif",color:"#fff",maxWidth:480,margin:"0 auto",display:"flex",flexDirection:"column"}}>

      {/* Name input modal */}
      {editingName&&(
        <div style={{position:"fixed",inset:0,background:"#000000ee",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:24}}>
          <div style={{background:"#0d1422",borderRadius:20,padding:28,width:"100%",maxWidth:360,border:"1px solid #00e5ff33"}}>
            <div style={{fontSize:28,textAlign:"center",marginBottom:8}}>💪</div>
            <div style={{color:"#e0e8f0",fontWeight:900,fontSize:18,textAlign:"center",marginBottom:4,letterSpacing:2,fontFamily:"monospace"}}>TRAIN or DIE</div>
            <div style={{color:"#445",fontSize:12,textAlign:"center",marginBottom:20}}>輸入你的名字開始使用</div>
            <input autoFocus value={nameInput} onChange={e=>setNameInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&saveName()}
              placeholder="你的名字..."
              style={{width:"100%",background:"#080e18",border:"1px solid #2a3a50",borderRadius:10,color:"#fff",fontSize:16,padding:"12px 14px",boxSizing:"border-box",marginBottom:12,textAlign:"center"}}/>
            <button onClick={saveName}
              style={{width:"100%",background:"linear-gradient(135deg,#00e5ff,#0077cc)",border:"none",borderRadius:10,color:"#000",fontWeight:900,fontSize:15,padding:"12px",cursor:"pointer"}}>
              開始訓練
            </button>
          </div>
        </div>
      )}

      <div style={{padding:"18px 18px 0",background:"linear-gradient(180deg,#0d1422 0%,#080e18 100%)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <div style={{width:36,height:36,background:"linear-gradient(135deg,#00e5ff,#0055cc)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>💪</div>
          <div style={{flex:1}}>
            <div style={{color:"#d0e0f0",fontWeight:900,fontSize:16,letterSpacing:2,fontFamily:"monospace"}}>TRAIN or DIE</div>
            <button onClick={()=>{setNameInput(userName);setEditingName(true);}}
              style={{background:"none",border:"none",padding:0,cursor:"pointer",textAlign:"left"}}>
              <div style={{color:"#2a3a50",fontSize:10,letterSpacing:1,marginTop:1}}>
                {userName?"👤 "+userName:"點擊設定名字"}
              </div>
            </button>
          </div>
        </div>
        <div style={{display:"flex",background:"#0a0e18",borderRadius:10,padding:3,gap:2}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)}
              style={{flex:1,background:tab===t.id?"#0e1a2e":"transparent",border:tab===t.id?"1px solid #00e5ff22":"1px solid transparent",borderRadius:7,color:tab===t.id?"#00e5ff":"#445",fontSize:11,fontWeight:tab===t.id?700:400,padding:"7px 0",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:3}}>
              <span>{t.icon}</span><span>{t.label}</span>
            </button>
          ))}
        </div>
      </div>
      <div style={{flex:1,padding:14,overflowY:"auto"}}>
        {tab==="log"        && <LogPage     data={data} setData={setData} plans={plans}/>}
        {tab==="plans"      && <PlansPage   plans={plans} setPlans={setPlans}/>}
        {tab==="exercisedb" && <ExerciseDBPage/>}
        {tab==="history"    && <HistoryPage data={data} setData={setData}/>}
        {tab==="stats"      && <StatsPage   data={data} plans={plans}/>}
        {tab==="pr"         && <PRPage/>}
      </div>
    </div>
  );
}

// Mount app
const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(React.createElement(App));
  </script>
</body>
</html>
